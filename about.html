<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới Thiệu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            background-color: #f5f5f5;
        }
        header {
            background-color: #0077cc;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        section {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center; /* canh giữa nội dung */
        }
        h2 {
            color: #0077cc;
        }
        img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #0077cc;
        }
        p {
            text-align: justify;
        }
    </style>
</head>
<body>

<header>
    <h1>Chào Mừng Đến Với Trang Giới Thiệu</h1>
</header>

<section>
    <h2>Giới Thiệu</h2>
    <!-- Ảnh chân dung -->
    <img src="images\avatar.jpg" alt="Ảnh chân dung">
    <p>Xin chào! Mình là Trần Bình Trọng, đam mê lập trình và thiết kế web. Trang này là nơi mình chia sẻ các dự án cá nhân, ý tưởng sáng tạo và kinh nghiệm trong lĩnh vực công nghệ thông tin. Mình luôn sẵn sàng học hỏi và kết nối với mọi người.</p>
</section>

</body>
</html>
